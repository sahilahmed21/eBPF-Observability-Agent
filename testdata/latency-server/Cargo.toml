[package]
name = "latency-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "latency-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
serde = { version = "1", features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
