# Phase 4 — DaemonSet (prefer capabilities; privileged fallback documented).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ebpf-obs-agent
  namespace: observability
spec:
  selector:
    matchLabels:
      app: ebpf-obs-agent
  template:
    metadata:
      labels:
        app: ebpf-obs-agent
    spec:
      hostPID: true
      serviceAccountName: ebpf-obs-agent
      containers:
        - name: agent
          image: ebpf-obs-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            # OTLP on via endpoint below. Ingest drops this process (tgid/comm)
            # and k8s-default otelcol — not a :4318 denylist.
            - name: OBSAGENT_HEADLESS
              value: "1"
            # warn by default; k8s_index refresh sizes are the dest-join heartbeat.
            - name: RUST_LOG
              value: warn,obsagent::k8s_index=info
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc:4318
          securityContext:
            privileged: false
            capabilities:
              drop: ["ALL"]
              add: ["BPF", "PERFMON", "SYS_PTRACE", "SYS_RESOURCE"]
            # If k3s rejects CAP_BPF, e2e-k3s.sh retries with privileged: true.
          volumeMounts:
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: debug
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: btf
          hostPath:
            path: /sys/kernel/btf
        - name: debug
          hostPath:
            path: /sys/kernel/debug
        - name: proc
          hostPath:
            path: /proc
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
