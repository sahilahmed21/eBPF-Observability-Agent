name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # agent/build.rs compiles the eBPF crate with nightly -Z build-std.
      - run: rustup toolchain install nightly --profile minimal --component rust-src
      - run: sudo apt-get update && sudo apt-get install -y clang llvm pkg-config
      # Prebuilt musl binary: `cargo install bpf-linker` fails here (cannot find libLLVM).
      - run: |
          d=$(mktemp -d)
          curl -fsSL https://github.com/aya-rs/bpf-linker/releases/download/v0.13.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst | tar --zstd -x -C "$d"
          install -m755 "$(find "$d" -type f -name bpf-linker | head -1)" "$HOME/.cargo/bin/bpf-linker"
          bpf-linker --version
      - uses: Swatinem/rust-cache@v2
      # .cargo/config.toml sets runner="sudo -E" for BPF loads; unit tests must not use it.
      - run: cargo test -p obsagent-common --features user --config 'target."cfg(all())".runner="env"'
      - run: cargo test -p obsagent --config 'target."cfg(all())".runner="env"'
