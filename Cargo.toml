[workspace]
resolver = "2"
members = ["agent", "common", "ebpf", "testdata/latency-server", "testdata/http-probe"]
# `ebpf` is excluded from the defaults: it only builds for bpfel-unknown-none, never the host.
# `cargo build --workspace` would try to build it for the host and fail.
default-members = ["agent", "common"]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }
aya-log = { version = "0.3.0", default-features = false }
aya-log-ebpf = { version = "0.2.0", default-features = false }

anyhow = { version = "1", default-features = false }
cargo_metadata = { version = "0.23.0", default-features = false }
crossterm = { version = "0.28", default-features = false }
env_logger = { version = "0.11.5", default-features = false }
hdrhistogram = { version = "7", default-features = false }
httparse = { version = "1", default-features = false }
libc = { version = "0.2.159", default-features = false }
log = { version = "0.4.22", default-features = false }
ratatui = { version = "0.29", default-features = false }
tokio = { version = "1.40.0", default-features = false }
which = { version = "6.0.0", default-features = false }

# BTF and line info must survive into the BPF object: aya-log and CO-RE both need it.
[profile.release.package.obsagent-ebpf]
debug = 2
codegen-units = 1
strip = false
